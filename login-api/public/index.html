<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Login</title>
    <style>
      * { box-sizing: border-box; }
      [hidden] { display: none !important; }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 16px;
        background: #f1f4f8;
        color: #1f2933;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      }
      .card {
        width: 100%;
        max-width: 440px;
        padding: 28px;
        background: #fff;
        border-radius: 12px;
        box-shadow: 0 4px 20px rgba(31, 41, 51, 0.12);
      }
      h1 { margin: 0 0 20px; font-size: 1.5rem; }
      h2 { margin: 20px 0 8px; font-size: 1rem; }
      label { display: block; margin-bottom: 14px; font-size: 0.9rem; font-weight: 600; }
      input {
        display: block;
        width: 100%;
        margin-top: 6px;
        padding: 10px 12px;
        border: 1px solid #c4cdd5;
        border-radius: 8px;
        font: inherit;
        font-weight: 400;
      }
      button {
        width: 100%;
        padding: 11px;
        border: 1px solid #1d5fd1;
        border-radius: 8px;
        background: #1d5fd1;
        color: #fff;
        font: inherit;
        font-weight: 600;
        cursor: pointer;
      }
      button:disabled { opacity: 0.6; cursor: not-allowed; }
      button.secondary { margin-top: 10px; background: #fff; color: #1d5fd1; }
      .error {
        margin-top: 14px;
        padding: 10px 12px;
        border-radius: 8px;
        background: #fdecea;
        color: #b3261e;
        font-size: 0.9rem;
      }
      .token {
        max-height: 110px;
        overflow-y: auto;
        padding: 10px;
        border-radius: 8px;
        background: #f1f4f8;
        font-family: ui-monospace, Menlo, Consolas, monospace;
        font-size: 0.75rem;
        word-break: break-all;
      }
      ul { margin: 0 0 20px; padding: 0; list-style: none; font-size: 0.85rem; }
      li {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        padding: 8px 0;
        border-bottom: 1px solid #e4e8ed;
      }
      .status-active { color: #15803d; font-weight: 700; }
      .status-expired, .status-closed { color: #616e7c; }
    </style>
  </head>
  <body>
    <main class="card">
      <section id="auth-view" hidden>
        <h1 id="auth-title">Entrar</h1>
        <form id="auth-form" novalidate>
          <label id="name-field" hidden>
            Nome
            <input id="name" type="text" autocomplete="name" />
          </label>
          <label>
            E-mail
            <input id="email" type="email" autocomplete="email" />
          </label>
          <label>
            Senha
            <input id="password" type="password" autocomplete="current-password" />
          </label>
          <button id="submit" type="submit">Entrar</button>
        </form>
        <button id="toggle-mode" class="secondary" type="button">Criar uma conta</button>
        <div id="error" class="error" role="alert" hidden></div>
      </section>

      <section id="session-view" hidden>
        <h1 id="greeting"></h1>
        <h2>Seu token de acesso</h2>
        <div id="token" class="token"></div>
        <h2>Últimos logins</h2>
        <ul id="logins"></ul>
        <button id="logout" type="button">Sair</button>
      </section>
    </main>
    <script type="module" src="/js/login.js"></script>
  </body>
</html>
